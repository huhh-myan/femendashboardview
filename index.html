<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    
    
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    
    *{ box-sizing: border-box; }
    
    @font-face {
      font-family: figtree;
      src: url(./assets/fonts/Figtree-VariableFont_wght.ttf);
    }


    body{ background-color: hsl(47, 88%, 63%); margin: 0; }
  
    .image-main-card{ 
      margin: auto; 
      border-radius: 10px; 
    }
    .main-card{
      background-color: hsl(0, 0%, 100%);
      width: 384px;
      height: 522px;
      padding: 24px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-shadow: 8px 8px 0px rgba(0, 0, 0, 1);
    }
    .avatar-main-card{
      display: flex;
      gap: 12px;
      align-items: center;
      width: 129px;
    }
    .avatar-main-card p{
      font-family: figtree;
      font-weight: 800;
      font-size: 14px;
      line-height: 150%;
      letter-spacing: 0%;
    }
    .text-holder{
      height: 194px;
      gap: 12px;
      display: flex;
      flex-direction: column;
    }
    p{
      margin: 0;
    }
    .colored-text-card{
      background-color: hsl(47, 88%, 63%);
      display: inline-block;
      width: 82px;
      height: 29px;
      padding-top: 4px;
      padding-bottom: 4px;
      border-radius: 4px;
      text-align: center;
      font-family: figtree;
      font-weight: 800;
      font-size: 14px;
      line-height: 150%;
      letter-spacing: 0%;
    }
    .text-published-date{
      font-family: figtree;
      font-weight: 500;
      font-size: 14px;
      line-height: 150%;
      letter-spacing: 0%;
    }
    .text-main-title{
      font-family: figtree;
      font-weight: 800;
      font-size: 24px;
      line-height: 150%;
      letter-spacing: 0%;
    }
    .text-description{
      font-family: figtree;
      font-weight: 500;
      font-size: 16px;
      line-height: 150%;
      letter-spacing: 0%;
      color: hsl(0, 0%, 42%);
    }
  </style>
</head>
<body>

  <div style="height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div class="main-card">
      <img src="assets/images/illustration-article.svg" class="image-main-card" alt="" height="200" />
      <div class="text-holder">
        <p class="colored-text-card">Learning</p>
        <p class="text-published-date">Published 21 Dec 2023</p>
        <p class="text-main-title">HTML & CSS foundations</p>
        <p class="text-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      </div>
      <div class="avatar-main-card">
        <img src="assets/images/image-avatar.webp" alt="" width="32" height="32"/>
        <p>Greg Hooper</p>
      </div>
    </div>
  </div>
  
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>
</html>
